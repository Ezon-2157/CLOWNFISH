name: Build Clownfish APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Package Clownfish into APK
        run: |
          # Create a temporary Cordova project
          cordova create ../cordova_build com.clownfish.game "Clownfish"
          
          # Clean default Cordova files
          rm -rf ../cordova_build/www/*
          
          # Copy your repository contents (index.html, images, styles) into www
          rsync -av --exclude='../cordova_build' ./ ../cordova_build/www/
          
          # Build Android APK
          cd ../cordova_build
          cordova platform add android
          cordova build android --debug

      - name: Upload Clownfish APK
        uses: actions/upload-artifact@v4
        with:
          name: Clownfish-APK
          path: ../cordova_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
